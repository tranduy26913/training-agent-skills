# Apache httpd configuration for COBOL CGI Employee programs
# Usage: httpd -f apache/httpd.conf
# Note: On Windows dev environment, use cgi-runner/server.js instead

ServerRoot "d:/training/cobol"
Listen 8081
LoadModule cgi_module modules/mod_cgi.so

# Serve CGI binaries from build/ directory
ScriptAlias /cgi-bin/ "d:/training/cobol/build/"

<Directory "d:/training/cobol/build/">
    Options +ExecCGI
    AllowOverride None
    Require all granted
    AddHandler cgi-script .cgi .exe
</Directory>

ErrorLog "d:/training/cobol/apache/error.log"
CustomLog "d:/training/cobol/apache/access.log" common
LogLevel warn
