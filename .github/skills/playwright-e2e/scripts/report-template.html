<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E2E Screenshot Report</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #263248;
      --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --pass: #22c55e; --fail: #ef4444; --skip: #f59e0b;
      --pass-bg: #14532d22; --fail-bg: #7f1d1d22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }

    /* ── Header ── */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .stat { text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .pass-num { color: var(--pass); }
    .fail-num { color: var(--fail); }
    .skip-num { color: var(--skip); }

    /* ── Layout ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

    /* ── Filter bar ── */
    .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 13px; transition: all .15s; }
    .filter-btn.active, .filter-btn:hover { border-color: var(--text); color: var(--text); }
    .filter-btn.active-pass { border-color: var(--pass); color: var(--pass); background: var(--pass-bg); }
    .filter-btn.active-fail { border-color: var(--fail); color: var(--fail); background: var(--fail-bg); }

    /* ── Suite card ── */
    .suite { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .suite-header { padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none; }
    .suite-header:hover { background: var(--surface2); }
    .suite-title { font-weight: 600; flex: 1; }
    .suite-file { font-size: 11px; color: var(--muted); font-family: monospace; }
    .suite-counts { font-size: 12px; display: flex; gap: 8px; }
    .chevron { font-size: 10px; color: var(--muted); transition: transform .2s; }
    .suite.collapsed .chevron { transform: rotate(-90deg); }
    .suite.collapsed .suite-body { display: none; }

    /* ── Test row ── */
    .test { border-top: 1px solid var(--border); }
    .test-header { padding: 10px 18px 10px 32px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .test-header:hover { background: var(--surface2); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-passed { background: var(--pass); }
    .dot-failed { background: var(--fail); box-shadow: 0 0 6px var(--fail); }
    .dot-skipped { background: var(--skip); }
    .test-title { flex: 1; }
    .test-duration { font-size: 12px; color: var(--muted); }
    .step-count { font-size: 11px; color: var(--muted); }
    .test.collapsed .test-body { display: none; }

    /* ── Test body ── */
    .test-body { padding: 12px 18px 18px 32px; background: var(--bg); }
    .error-box { background: var(--fail-bg); border: 1px solid var(--fail); border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; font-family: monospace; font-size: 12px; color: #fca5a5; white-space: pre-wrap; word-break: break-word; }

    /* ── Screenshot strip ── */
    .steps-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 10px; }
    .steps-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .step-card { flex-shrink: 0; width: 200px; }
    .step-card .step-name { font-size: 11px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step-card .step-name.failed { color: var(--fail); }
    .step-thumb { width: 200px; height: 120px; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; transition: border-color .15s; }
    .step-thumb:hover { border-color: var(--text); }
    .step-thumb.failed { border-color: var(--fail); }

    /* ── Lightbox ── */
    .lightbox { display: none; position: fixed; inset: 0; background: #000000cc; z-index: 1000; align-items: center; justify-content: center; padding: 24px; }
    .lightbox.open { display: flex; flex-direction: column; gap: 10px; }
    .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 24px 80px #0009; }
    .lightbox-caption { color: var(--text); font-size: 14px; text-align: center; }
    .lightbox-close { position: fixed; top: 16px; right: 20px; font-size: 28px; cursor: pointer; color: white; line-height: 1; }
    .no-steps { color: var(--muted); font-size: 13px; font-style: italic; }
  </style>
</head>
<body>

<script id="report-data" type="application/json">"__REPORT_DATA__"</script>

<div id="header" class="header">
  <div style="flex:1">
    <h1>📸 E2E Screenshot Report</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="stat"><div class="num pass-num" id="s-pass">0</div><div class="lbl">Passed</div></div>
  <div class="stat"><div class="num fail-num" id="s-fail">0</div><div class="lbl">Failed</div></div>
  <div class="stat"><div class="num skip-num" id="s-skip">0</div><div class="lbl">Skipped</div></div>
  <div class="stat"><div class="num" id="s-dur">0s</div><div class="lbl">Duration</div></div>
</div>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="failed">Failed only</button>
    <button class="filter-btn" data-filter="passed">Passed only</button>
  </div>
  <div id="suites"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <img id="lb-img" src="" alt="" />
  <div class="lightbox-caption" id="lb-cap"></div>
</div>

<script>
(function () {
  const raw = document.getElementById('report-data').textContent.trim();
  const report = JSON.parse(JSON.parse(raw));

  // ── Header stats
  document.getElementById('s-pass').textContent = report.totalPassed;
  document.getElementById('s-fail').textContent = report.totalFailed;
  document.getElementById('s-skip').textContent = report.totalSkipped;
  document.getElementById('s-dur').textContent = (report.duration / 1000).toFixed(1) + 's';
  document.getElementById('meta').textContent =
    'Generated ' + new Date(report.generatedAt).toLocaleString();

  // ── Render
  const container = document.getElementById('suites');

  report.suites.forEach(function (suite) {
    const card = document.createElement('div');
    card.className = 'suite';
    card.dataset.passed = suite.passed;
    card.dataset.failed = suite.failed;

    const hdr = document.createElement('div');
    hdr.className = 'suite-header';
    hdr.innerHTML =
      '<span class="chevron">▼</span>' +
      '<span class="suite-title">' + esc(suite.title || suite.file.split(/[\\/]/).pop()) + '</span>' +
      '<span class="suite-file">' + esc(suite.file.replace(/.*[/\\]e2e[/\\]/, 'e2e/')) + '</span>' +
      '<span class="suite-counts">' +
        '<span style="color:var(--pass)">✓ ' + suite.passed + '</span>' +
        (suite.failed ? '<span style="color:var(--fail)">✗ ' + suite.failed + '</span>' : '') +
      '</span>';

    hdr.addEventListener('click', function () { card.classList.toggle('collapsed'); });
    card.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'suite-body';

    suite.tests.forEach(function (test) {
      const row = document.createElement('div');
      row.className = 'test collapsed';
      row.dataset.status = test.status;

      const dotClass = test.status === 'passed' ? 'dot-passed'
                     : test.status === 'failed'  ? 'dot-failed' : 'dot-skipped';

      const tHdr = document.createElement('div');
      tHdr.className = 'test-header';
      tHdr.innerHTML =
        '<span class="status-dot ' + dotClass + '"></span>' +
        '<span class="test-title">' + esc(test.title) + '</span>' +
        (test.steps.length ? '<span class="step-count">' + test.steps.length + ' steps</span>' : '') +
        '<span class="test-duration">' + (test.duration / 1000).toFixed(2) + 's</span>';

      tHdr.addEventListener('click', function () { row.classList.toggle('collapsed'); });
      row.appendChild(tHdr);

      const tBody = document.createElement('div');
      tBody.className = 'test-body';

      if (test.error) {
        const eb = document.createElement('div');
        eb.className = 'error-box';
        eb.textContent = test.error;
        tBody.appendChild(eb);
      }

      if (test.steps.length > 0) {
        const lbl = document.createElement('div');
        lbl.className = 'steps-label';
        lbl.textContent = 'Step screenshots';
        tBody.appendChild(lbl);

        const strip = document.createElement('div');
        strip.className = 'steps-strip';

        test.steps.forEach(function (step) {
          const sc = document.createElement('div');
          sc.className = 'step-card';
          const isFail = step.status === 'failed';
          sc.innerHTML =
            '<div class="step-name' + (isFail ? ' failed' : '') + '" title="' + esc(step.name) + '">' +
              esc(step.name) +
            '</div>' +
            (step.screenshot
              ? '<img class="step-thumb' + (isFail ? ' failed' : '') + '"' +
                ' src="data:image/png;base64,' + step.screenshot + '"' +
                ' alt="' + esc(step.name) + '"' +
                ' onclick="openLightbox(this, \'' + esc(step.name).replace(/'/g, "\\'") + '\')" />'
              : '<div class="step-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;">no screenshot</div>');
          strip.appendChild(sc);
        });

        tBody.appendChild(strip);
      } else {
        const ns = document.createElement('p');
        ns.className = 'no-steps';
        ns.textContent = 'No step screenshots captured. Wrap actions with screenshotStep() to capture.';
        tBody.appendChild(ns);
      }

      row.appendChild(tBody);
      body.appendChild(row);
    });

    card.appendChild(body);
    container.appendChild(card);
  });

  // ── Filter
  document.querySelectorAll('.filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(function (b) {
        b.classList.remove('active', 'active-pass', 'active-fail');
      });
      btn.classList.add(
        filter === 'all'    ? 'active' :
        filter === 'passed' ? 'active-pass' : 'active-fail'
      );

      document.querySelectorAll('.suite').forEach(function (suite) {
        const tests = suite.querySelectorAll('.test');
        let visible = 0;
        tests.forEach(function (t) {
          const show = filter === 'all' || t.dataset.status === filter ||
                       (filter === 'failed' && t.dataset.status === 'timedOut');
          t.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        suite.style.display = visible === 0 ? 'none' : '';
      });
    });
  });

  // ── Helpers
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.openLightbox = function (img, caption) {
    document.getElementById('lb-img').src = img.src;
    document.getElementById('lb-cap').textContent = caption;
    document.getElementById('lightbox').classList.add('open');
  };

  window.closeLightbox = function () {
    document.getElementById('lightbox').classList.remove('open');
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
})();
</script>

</body>
</html>
